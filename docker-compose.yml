services:
  hello-service:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8080:8080"

    environment:
      GREETING: Hello
      NAME: World

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "-",
          "http://localhost:8080/health"
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    restart: unless-stopped
